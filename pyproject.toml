[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numax_proxies"
version = "0.7.0"
description = "numax of solar-like oscillators from the collapsed ACF and the coefficient of variation of the PSD."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Johannes Jørgensen", email = "johannes.joergensen@uibk.ac.at" }
]
urls = { Homepage = "https://github.com/Johanneshj/numax_proxies" }

dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "numba>=0.59",
    "rocket-fft>=0.2",
    "pandas>=2.2",
    "pyarrow>=15",
    "fastparquet",
    "astropy>=6.0",
    "matplotlib>=3.8",
    "pyyaml",
    "uncertainties",
]

[project.optional-dependencies]
# light curves from fits files / downloads
lightcurves = ["lightkurve>=2.4"]
# averaged PSD
avgpsd = ["nifty-ls>=1.0"]
# Gaia query for the scaling relations
gaia = ["astroquery", "pyvo"]
# figure style
plots = ["SciencePlots"]
all = ["numax_proxies[lightcurves,avgpsd,gaia,plots]"]
dev = ["numax_proxies[all]", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
numax_proxies = ["fap_tables.json", "comb_scan_null.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
